<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient che do toi: sac do sang hon de tuong phan voi nen obsidian -->
    <linearGradient id="sh-s-dark" x1="0.85" y1="0.05" x2="0.15" y2="0.95">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="0.5" stop-color="#FB8B24"/>
      <stop offset="1" stop-color="#F0532D"/>
    </linearGradient>
    <filter id="sh-glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Chu S ribbon giong het ban light, bo sung hieu ung glow nhe cho nen toi -->
  <path id="survhub-s-dark"
    d="M 256 72 A 92 92 0 0 0 256 256 A 92 92 0 0 1 256 440"
    stroke="url(#sh-s-dark)" stroke-width="84" stroke-linecap="round" fill="none"
    filter="url(#sh-glow-dark)"/>
</svg>
